<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Even Numbers</title>
    <style>
        body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
      color: darkblue;
    }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Sum of Even Numbers from 1 to N</h2>
    <label for="numberInput">Input a Number(N) : </label>
    <input type="number" id="numberInput" min="1" placeholder="Enter N">
    <button onclick="calculateSum()">Calculate</button>
    <div id="result"></div>
    <script>
        function calculateSum(){
            let N = parseInt(document.getElementById("numberInput").value);
            let sum = 0;
            for(let i =2; i<=N;i +=2)
            {
            sum +=i; 
            }
        document.getElementById("result").innerText = 
        "Sum of Even Number from 1 to "+ N+ " is : " +sum;
        }
    </script>
    
</body>
</html>
